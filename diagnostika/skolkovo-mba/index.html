      <h1 style="font-family:var(--font-display);font-weight:400;font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:1.05;letter-spacing:-0.03em;margin:0 0 18px;color:var(--ink)">Анкета участника</h1>
      <p class="lede2" style="max-width:680px">Десять минут о том, как вы работаете с ИИ сейчас и какую задачу привезёте в Казань. По ответам собираем группы и настраиваем программу.</p>

  <script>
    var DIAG = {"company":"skolkovo-mba","survey":"mba"};
    var PLAIN_HTML = "\n  \u003csection class=\"blk\" style=\"padding-top:8px\">\n    \u003cdiv class=\"wrap\">\n      \u003cp class=\"mat-p\" style=\"font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-55)\">Цифровые сотрудники за 8 шагов\u003c/p>\n      \u003cp class=\"mat-p\">За три дня каждый собирает \u003cb>цифрового сотрудника\u003c/b> — ИИ-агента, который работает на вашем ноутбуке под вашу реальную задачу. В зале будут люди, которые ИИ не открывали, и люди, которые уже строят своих агентов. Чтобы обоим было полезно, нам нужно заранее понять, кто с чем едет.\u003c/p>\u003cp class=\"mat-p\">Ответы читают преподаватели модуля. Где просим оценку — пишите как есть, точность не нужна.\u003c/p>\n      \u003cdiv class=\"facts\">\u003cdiv class=\"fact\">\u003cdiv class=\"fn\">10 минут\u003c/div>\u003cdiv class=\"fd\">черновик сохраняется — можно закончить позже\u003c/div>\u003c/div>\u003cdiv class=\"fact\">\u003cdiv class=\"fn\">Без экзамена\u003c/div>\u003cdiv class=\"fd\">правильных ответов нет, нужна честная картина\u003c/div>\u003c/div>\u003cdiv class=\"fact\">\u003cdiv class=\"fn\">Под вас\u003c/div>\u003cdiv class=\"fd\">по уровню делим на потоки, по задаче — подбираем примеры\u003c/div>\u003c/div>\u003c/div>\n      \u003cform class=\"anketa\" id=\"diag-form\" onsubmit=\"return sendDiag(this)\" autocomplete=\"off\" novalidate>\n        \u003cdiv class=\"fsep\">Кто вы\u003c/div>\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\" for=\"q1\">\u003cspan class=\"qn\">1.\u003c/span> Имя и фамилия \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput class=\"fin\" id=\"q1\" name=\"q1\" required maxlength=\"120\">\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">2.\u003c/span> Как вы связаны со Сколково \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"chips\">\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q2\" value=\"Выпускник MBA-5\" required>\u003cspan>Выпускник MBA-5\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q2\" value=\"Выпускник другого потока\">\u003cspan>Выпускник другого потока\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q2\" value=\"Учусь на MBA сейчас\">\u003cspan>Учусь на MBA сейчас\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q2\" value=\"Друг или гость выпускника\">\u003cspan>Друг или гость выпускника\u003c/span>\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">3.\u003c/span> Ваша роль сейчас \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"chips\">\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q3\" value=\"Собственник, первое лицо\" required>\u003cspan>Собственник, первое лицо\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q3\" value=\"Топ-менеджер в компании\">\u003cspan>Топ-менеджер в компании\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q3\" value=\"Руководитель направления\">\u003cspan>Руководитель направления\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q3\" value=\"Инвестор, член совета директоров\">\u003cspan>Инвестор, член совета директоров\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q3\" value=\"Эксперт, консультант\">\u003cspan>Эксперт, консультант\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q3\" value=\"В поиске или переходе\">\u003cspan>В поиске или переходе\u003c/span>\u003c/label>\u003c/div>\u003cinput class=\"fin fother\" name=\"q3_other\" maxlength=\"300\" placeholder=\"Другое — впишите\">\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\" for=\"q4\">\u003cspan class=\"qn\">4.\u003c/span> Отрасль и масштаб компании \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput class=\"fin\" id=\"q4\" name=\"q4\" required maxlength=\"300\" placeholder=\"Например: девелопмент, 300 человек · дистрибуция медтехники, 40 человек\">\u003c/div>\n\u003cdiv class=\"fsep\">Как вы работаете с ИИ сейчас\u003c/div>\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">5.\u003c/span> Как часто пользуетесь ИИ \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"chips\">\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q5\" value=\"Каждый день\" required>\u003cspan>Каждый день\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q5\" value=\"Несколько раз в неделю\">\u003cspan>Несколько раз в неделю\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q5\" value=\"Редко, от случая к случаю\">\u003cspan>Редко, от случая к случаю\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q5\" value=\"Пока не пользуюсь\">\u003cspan>Пока не пользуюсь\u003c/span>\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"fgroup\" data-req-group=\"q6\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">6.\u003c/span> Чем пользуетесь \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"chips\">\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"ChatGPT\">\u003cspan>ChatGPT\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"Claude\">\u003cspan>Claude\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"Gemini\">\u003cspan>Gemini\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"Perplexity\">\u003cspan>Perplexity\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"DeepSeek\">\u003cspan>DeepSeek\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"GigaChat\">\u003cspan>GigaChat\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"YandexGPT / Алиса\">\u003cspan>YandexGPT / Алиса\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"Cursor\">\u003cspan>Cursor\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"Claude Code / Codex\">\u003cspan>Claude Code / Codex\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"ИИ внутри рабочих программ\">\u003cspan>ИИ внутри рабочих программ\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q6\" value=\"Пока ничем\">\u003cspan>Пока ничем\u003c/span>\u003c/label>\u003c/div>\u003cinput class=\"fin fother\" name=\"q6_other\" maxlength=\"300\" placeholder=\"Другое — впишите\">\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">7.\u003c/span> Платите ли вы за ИИ \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"chips\">\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q7\" value=\"Да, сам(а)\" required>\u003cspan>Да, сам(а)\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q7\" value=\"Да, платит компания\">\u003cspan>Да, платит компания\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q7\" value=\"Пробовал(а), сейчас нет\">\u003cspan>Пробовал(а), сейчас нет\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q7\" value=\"Нет\">\u003cspan>Нет\u003c/span>\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">8.\u003c/span> Оцените свой уровень — какое описание ближе всего \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"fhint\">Выберите самый высокий уровень, который делаете регулярно, а не пробовали однажды.\u003c/div>\u003cdiv class=\"levels\">\u003clabel class=\"lvl\">\u003cinput type=\"radio\" name=\"q8\" value=\"0\" required>\u003cspan class=\"ln\">0\u003c/span>\u003cspan class=\"lt\">Пока не пользуюсь\u003c/span>\u003c/label>\u003clabel class=\"lvl\">\u003cinput type=\"radio\" name=\"q8\" value=\"1\">\u003cspan class=\"ln\">1\u003c/span>\u003cspan class=\"lt\">Пишу запрос в чат для рабочей задачи\u003c/span>\u003c/label>\u003clabel class=\"lvl\">\u003cinput type=\"radio\" name=\"q8\" value=\"2\">\u003cspan class=\"ln\">2\u003c/span>\u003cspan class=\"lt\">Дорабатываю ответ: уточняю, прошу переделать, включаю рассуждение и глубокий поиск\u003c/span>\u003c/label>\u003clabel class=\"lvl\">\u003cinput type=\"radio\" name=\"q8\" value=\"3\">\u003cspan class=\"ln\">3\u003c/span>\u003cspan class=\"lt\">Работаю со своими файлами и проектами: загружаю документы, держу контекст задачи\u003c/span>\u003c/label>\u003clabel class=\"lvl\">\u003cinput type=\"radio\" name=\"q8\" value=\"4\">\u003cspan class=\"ln\">4\u003c/span>\u003cspan class=\"lt\">Подключаю ИИ к своим системам и данным: почта, календарь, CRM, таблицы\u003c/span>\u003c/label>\u003clabel class=\"lvl\">\u003cinput type=\"radio\" name=\"q8\" value=\"5\">\u003cspan class=\"ln\">5\u003c/span>\u003cspan class=\"lt\">Пишу собственные инструкции, которые ИИ выполняет повторно\u003c/span>\u003c/label>\u003clabel class=\"lvl\">\u003cinput type=\"radio\" name=\"q8\" value=\"6\">\u003cspan class=\"ln\">6\u003c/span>\u003cspan class=\"lt\">Запускаю несколько агентов, которые работают вместе\u003c/span>\u003c/label>\u003clabel class=\"lvl\">\u003cinput type=\"radio\" name=\"q8\" value=\"7\">\u003cspan class=\"ln\">7\u003c/span>\u003cspan class=\"lt\">Встраиваю агентов в рабочие процессы компании\u003c/span>\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"fgroup\" data-req-group=\"q9\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">9.\u003c/span> Что из этого вы уже делали сами \u \">\u003cinput type=\"radio\" name=\"q14\" value=\"Продажи и клиенты\">\u003cspan>Продажи и клиенты\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q14\" value=\"Маркетинг и контент\">\u003cspan>Маркетинг и контент\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q14\" value=\"Финансы и аналитика\">\u003cspan>Финансы и аналитика\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q14\" value=\"Операции и закупки\">\u003cspan>Операции и закупки\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q14\" value=\"Команда и найм\">\u003cspan>Команда и найм\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q14\" value=\"Инвестиции, анализ рынков и сделок\">\u003cspan>Инвестиции, анализ рынков и сделок\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q14\" value=\"Личное: семья, хобби, здоровье\">\u003cspan>Личное: семья, хобби, здоровье\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q14\" value=\"Пока не знаю\">\u003cspan>Пока не знаю\u003c/span>\u003c/label>\u003c/div>\u003cinput class=\"fin fother\" name=\"q14_other\" maxlength=\"300\" placeholder=\"Другое — впишите\">\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\" for=\"q15\">\u003cspan class=\"qn\">15.\u003c/span> Опишите задачу, которую хотите отдать цифровому сотруднику \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"fhint\">Хорошая задача повторяется, у неё понятный результат и есть данные. Что делаете сейчас, как часто, сколько времени занимает, что на выходе.\u003c/div>\u003ctextarea class=\"fin\" id=\"q15\" name=\"q15\" required rows=\"4\" maxlength=\"2500\" placeholder=\"Например: каждый понедельник свожу отчёты пяти подразделений в одну сводку для собственника — 3 часа, Excel и письма руководителей, на выходе страница с цифрами an>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q17\" value=\"Картину рынка: что ИИ уже умеет, а что пока нет\">\u003cspan>Картину рынка: что ИИ уже умеет, а что пока нет\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q17\" value=\"Идеи для нового бизнеса или продукта\">\u003cspan>Идеи для нового бизнеса или продукта\u003c/span>\u003c/label>\u003c/div>\u003cinput class=\"fin fother\" name=\"q17_other\" maxlength=\"300\" placeholder=\"Другое — впишите\">\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\" for=\"q18\">\u003cspan class=\"qn\">18.\u003c/span> Что пробовали с ИИ и не сработало — или чего опасаетесь \u003cspan class=\"opt\">необязательно\u003c/span>\u003c/label>\u003ctextarea class=\"fin\" id=\"q18\" name=\"q18\" rows=\"2\" maxlength=\"2500\">\u003c/textarea>\u003c/div>\n\u003cdiv class=\"fsep\">Техника\u003c/div>\u003cp class=\"flead\">Работаем в Cursor на вашем ноутбуке. Корпоративные ноутбуки часто не дают ставить программы — это лучше узнать сейчас, а не в Казани.\u003c/p>\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">19.\u003c/span> На каком ноутбуке поедете \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"chips\">\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q19\" value=\"Mac\" required>\u003cspan>Mac\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q19\" value=\"Windows\">\u003cspan>Windows\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q19\" value=\"Пока не знаю\">\u003cspan>Пока не знаю\u003c/span>\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">20.\u003c/span> Можно ли ставить на него программы \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"chips\">\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q20\" value=\"Да, ноутбук личный\" required>\u003cspan>Да, ноутбук личный\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q20\" value=\"Корпоративный, ставить можно\">\u003cspan>Корпоративный, ставить можно\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q20\" value=\"Корпоративный, ставить нельзя\">\u003cspan>Корпоративный, ставить нельзя\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"radio\" name=\"q20\" value=\"Не знаю\">\u003cspan>Не знаю\u003c/span>\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"fgroup\" data-req-group=\"q21\">\u003clabel class=\"flab\">\u003cspan class=\"qn\">21.\u003c/span> Что из подготовки уже есть \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cdiv class=\"chips\">\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q21\" value=\"Cursor установлен\">\u003cspan>Cursor установлен\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q21\" value=\"Есть платный доступ к модели\">\u003cspan>Есть платный доступ к модели\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q21\" value=\"Работает VPN\">\u003cspan>Работает VPN\u003c/span>\u003c/label>\u003clabel class=\"chip\">\u003cinput type=\"checkbox\" name=\"q21\" value=\"Пока ничего\">\u003cspan>Пока ничего\u003c/span>\u003c/label>\u003c/div>\u003c/div>\n\u003cdiv class=\"fgroup\">\u003clabel class=\"flab\" for=\"q22\">\u003cspan class=\"qn\">22.\u003c/span> Telegram для связи \u003cspan class=\"req\">*\u003c/span>\u003c/label>\u003cinput class=\"fin\" id=\"q22\" name=\"q22\" required maxlength=\"80\" placeholder=\"@nickname\">\u003c/div>\n        \u003cbutton class=\"fbtn\" type=\"submit\">Отправить анкету\u003c/button>\n        \u003cdiv class=\"fmsg\" id=\"diag-msg\">\u003c/div>\n        \u003cdiv class=\"fsaved\" id=\"diag-saved\">Черновик сохраняется в этом браузере — можно закрыть страницу и вернуться.\u003c/div>\n      \u003c/form>\n    \u003c/div>\n  \u003c/section>";
    
    function b64(s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
    var DRAFT_KEY = 'hakku_diag_draft_' + DIAG.company + '_' + DIAG.survey, PW_KEY = 'hakku_diag_pw_' + DIAG.company;
    function collect(form) {
      var a = {};
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.name) return;
        if (el.type === 'checkbox') { if (el.checked) (a[el.name] = a[el.name] || []).push(el.value); }
        else if (el.type === 'radio') { if (el.checked) a[el.name] = el.value; }
        else if (el.value.trim()) a[el.name] = el.value.trim();
      });
      return a;
    }
    function restore(form) {
      var d; try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
      if (!d) return;
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.name || !(el.name in d)) return;
        var v = d[el.name];
        if (el.type === 'checkbox') el.checked = [].concat(v).indexOf(el.value) >= 0;
        else if (el.type === 'radio') el.checked = el.value === v;
        else el.value = v;
      });
    }
    function saveDraft(form) { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(collect(form))); } catch (e) {} }
    function validate(form) {
      form.querySelectorAll('.ferr').forEach(function (n) { n.classList.remove('ferr'); });
      var bad = null, a = collect(form);
      Array.prototype.forEach.call(form.elements, function (el) {
        if (!el.required || !el.name) return;
        if (!(el.name in a)) { var g = el.closest('.mrow') || el.closest('.fgroup'); if (g) { g.classList.add('ferr'); bad = bad || g; } }
      });
      form.querySelectorAll('[data-req-group]').forEach(function (g) {
        var n = g.getAttribute('data-req-group');
        if (!(n in a) && !((n + '_other') in a)) { g.classList.add('ferr'); bad = bad || g; }
      });
      return bad;
    }
    window.sendDiag = function (form) {
      var msg = document.getElementById('diag-msg'), btn = form.querySelector('.fbtn');
      var bad = validate(form);
      if (bad) {
        msg.className = 'fmsg err'; msg.textContent = 'Не заполнены обязательные вопросы — они подсвечены.';
        bad.scrollIntoView({ behavior: 'smooth', block: 'center' }); return false;
      }
      btn.disabled = true; btn.textContent = 'Отправляю…'; msg.className = 'fmsg'; msg.textContent = '';
      fetch('/shkola-api/diag', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ survey: DIAG.survey, company: DIAG.company, answers: collect(form) }) })
      .then(function (r) { return r.json(); }).then(function (j) {
        if (!(j && j.ok)) throw new Error('fail');
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        Array.prototype.forEach.call(form.children, function (el) { if (el.id !== 'diag-msg') el.style.display = 'none'; });
        msg.className = 'fmsg ok'; msg.textContent = 'Спасибо, анкета отправлена. Ответы прочитаю до начала обучения.';
        msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }).catch(function () {
        btn.disabled = false; btn.textContent = 'Отправить анкету';
        msg.className = 'fmsg err'; msg.textContent = 'Не отправилось. Проверьте интернет и нажмите ещё раз — черновик сохранён.';
      });
      return false;
    };
    async function doUnlock(pwd, silent) {
      var err = document.getElementById('err'); if (err) err.classList.remove('show');
      if (!pwd) return false;
      try {
        var enc = new TextEncoder();
        var km = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
        var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: 100000, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
        mount(new TextDecoder().decode(buf));
        try { localStorage.setItem(PW_KEY, pwd); } catch (e) {}
        return true;
      } catch (e) {
        if (!silent) { if (err) err.classList.add('show'); var p = document.getElementById('pwd'); if (p) p.select(); }
        return false;
      }
    }
    function mount(html) {
      document.getElementById('gated-content').innerHTML = html;
      var lw = document.getElementById('lockwrap'); if (lw) lw.remove();
      var form = document.getElementById('diag-form');
      restore(form);
      var t; form.addEventListener('input', function () { clearTimeout(t); t = setTimeout(function () { saveDraft(form); }, 400); });
      form.addEventListener('change', function (e) { saveDraft(form); var g = e.target.closest('.ferr'); if (g) g.classList.remove('ferr'); });
    }
    function unlock() { var p = document.getElementById('pwd'); doUnlock(p ? p.value : '', false); }
    if (typeof PLAIN_HTML === 'string') mount(PLAIN_HTML);
    else (function () { try { var s = localStorage.getItem(PW_KEY); if (s) doUnlock(s, true); } catch (e) {} })();
  </script>
